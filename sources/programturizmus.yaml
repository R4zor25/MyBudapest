id: programturizmus
name: Programturizmus
enabled: true
priority: 40          # weakest of the enabled sources: Port.hu (10) and kvizestek (20) win merges
fetcher: http
rate_limit_seconds: 3
plugin: null

# §6.1 step 3 — real, verified against the two saved fixtures (2026-08-22).
#
# This replaces the earlier placeholder, whose three objections were re-checked. Two were
# solved; the third was right about the fragility but wrong about where to look.
#
#   * Budapest scoping (was: "the category page is nationwide"). There IS a Budapest-only
#     listing, it just is not a county page: Budapest is absent from the 19 `megye-*`
#     entries and from the 93 `taj-*` regions, and both `/megye-budapest.html` and
#     `/taj-budapest.html` are SOFT 404s — HTTP 200 carrying "Az oldal nem található".
#     The real handle is the settlement page, `/telepules-budapest-fovaros.html`, found
#     via the `telepules` and `kerulet` sitemaps. `?fs=dc` selects its Események tab.
#     1206 Budapest events at capture time. Nothing outside Budapest is fetched.
#   * Hashed CSS-module classes (was: "will change on their next deploy"). True —
#     `ContentItemCard_contentItemCardContainer__T2qE3` carries a per-build hash. The
#     selectors below therefore match on the STABLE prefix with `[class*="..."]` and never
#     on the hash. The module name is source-code identity, not build output. The old note
#     also worried that `Text_menu-button__*` styles both a card's date and unrelated nav;
#     that is true, and the `>` combinator in `start_raw` is what keeps them apart.
#   * Triple rendering. Confirmed and unchanged: every event is emitted three times, in
#     `div.d-desktop`, `div.d-tablet` and `div.d-mobile` responsive wrappers (30 sections
#     for 10 events). Scoping the item selector to `div.d-desktop` takes each event once.
#     Do not drop that prefix — without it every event triples.
#
# PAGINATION IS AN OFFSET, NOT A PAGE NUMBER: `&f=10`, `&f=20`, ... in steps of ten
# (121 pages at capture time). §6.3's `pagination.param` increments by one, which here
# would fetch windows shifted by a single record with ninefold overlap, so the two pages
# are listed explicitly instead. Two pages = 20 events per run, deliberately modest for a
# source whose records are mostly umbrella programme pages (see the batch report).
listing:
  urls:
    - "https://www.programturizmus.hu/telepules-budapest-fovaros.html?fs=dc"
    - "https://www.programturizmus.hu/telepules-budapest-fovaros.html?fs=dc&f=10"
  item_selector: 'div.d-desktop section[class*="ContentItemCard_contentItemCardContainer"]'

fields:
  # The title anchor wraps an <h2> on some cards and a <p> on others, so the field selects
  # the <a> itself and takes its text rather than betting on the inner tag.
  title: { selector: '[class*="ContentItemCard_titleContainer"] a', attr: text }
  url: { selector: '[class*="ContentItemCard_titleContainer"] a', attr: href, absolute: true }
  # Direct child of the wrapper's first div. The `>` matters: the same `Text_menu-button__*`
  # class also styles the county/city/district links inside `ContentItemCard_locationContainer`,
  # which sits deeper in the same subtree.
  start_raw:
    selector: '[class*="ContentItemCard_descriptionWrapper"] > div > p[class*="Text_menu-button"]'
    attr: text
  end_raw:
    selector: '[class*="ContentItemCard_descriptionWrapper"] > div > p[class*="Text_menu-button"]'
    attr: text
    optional: true
  # NO district_raw, deliberately. The card does carry one — the location strip links to
  # `/kerulet-13-kerulet-budapest.html` with the text "13. kerület" — but normalize.py only
  # converts a district to the project's Roman form (`IX.`) when it arrives as an int
  # (`roman_district`); a string is passed through verbatim. This source would therefore
  # produce `district: "9. kerület - Ferencváros"` where Port.hu produces `"IX."`, and §7.7
  # compares `district == home.district` by equality — so the proximity bonus would silently
  # never fire for these events, and the UI would show two spellings side by side. The §6.3
  # transform vocabulary cannot turn "9. kerület" into "IX.". Leaving the field unmapped
  # loses the district; mapping it as text loses it too, but invisibly. See the batch report.
  image_url: { selector: 'img[class*="ContentItemCard_image"]', attr: src, optional: true }
  description:
    selector: 'p[class*="ContentItemCard_descriptionText"]'
    attr: text
    optional: true

transforms:
  title: [html_unescape, strip]
  # "2026.08.22. (szombat)" and "2026.08.17. (hétfő) - 2026.08.23. (vasárnap)" — the
  # parenthesised weekday is not a format normalize.py knows, so each end of the range is
  # cut out as a bare "%Y.%m.%d." date, which it does know.
  start_raw: [strip, 'regex:^(\d{4}\.\d{2}\.\d{2}\.):1']
  # Same cell, second date. The capture group sits INSIDE an optional group on purpose: on
  # a single-date card the pattern still matches (at position 0, matching nothing), group 1
  # is None, and the field clears to None instead of keeping the raw text and logging an
  # unparseable_end warning for the ~35% of cards carrying one date. 13 of the 20 sampled
  # cards are ranges, and dropping their end would strand every multi-day run that started
  # before today as a past event.
  end_raw: [strip, 'regex:^(?:[^-]*-\s*(\d{4}\.\d{2}\.\d{2}\.))?:1']
  description: [html_unescape, strip, "truncate:400"]
