id: bigcitylife
name: Big City Life
enabled: true
priority: 30
fetcher: http
rate_limit_seconds: 2
plugin: null

# Real, verified against a fetched page (tests/fixtures/bigcitylife_list.html, saved
# 2026-08-16): a plain server-rendered listing, no pagination on this URL — every
# upcoming-weekend event is on the one page. Two of the eleven `.eventBox` elements on
# that page are Google AdSense slots that reuse the class for styling, not events; they
# have no `h2 a` and are correctly skipped as a missing required field (§ package 11
# report), not a selector bug.
#
# The date text ("2026. augusztus 16., vasárnap 18:00") needed a small, additive fix to
# normalize.py's date parsing (a spelled-out Hungarian month name) — see the package 11
# report for why that crossed outside this package's file list.
#
# PRIORITY STAYS 30, i.e. it never outranks Port.hu (20) in a dedup merge. The culture
# batch asked whether a specialist should sit below 20 so it wins those fields; this one
# should not. It is a curated weekly "what's on this weekend" pick — eight events on the
# sampled page, one row per event, chosen editorially — not a repertoire feed with
# authoritative per-performance data. It carries no field where it is the better source:
# no price beyond a free-text string, no coordinates, no native category. Where it does
# overlap Port.hu it is the same event described more loosely, so the lower-priority
# position is correct and its real value is the `urls` union, not the merge.
#
# REPERTOIRE SHAPE (culture batch, requirement 2): individual dates, no ranges. On the
# saved fixture all 9 parsed records are distinct (title, venue) pairs, none repeats on
# another date, and none carries an end date on a different day. A weekend-picks list
# cannot show the twenty-performances-of-one-production pattern, so this source neither
# demonstrates nor rules out that risk.
listing:
  urls:
    - "https://bigcitylife.hu/hetvegi-programok-budapesten"
  item_selector: "div.eventBox"

fields:
  title: { selector: "h2 a", attr: text }
  url: { selector: "h2 a", attr: href, absolute: true }
  start_raw: { selector: ".eventDate", attr: text }
  venue_name: { selector: ".eventTags .eventPlace", attr: text, optional: true }
  price_raw: { selector: ".eventPrices .eventPrice", attr: text, optional: true }
  image_url: { selector: "img", attr: "data-src", optional: true }
  description: { selector: "p", attr: text, optional: true }

transforms:
  title: [html_unescape, strip]
  # Strips the card's own "További részletek" (read more) link text, which node.text()
  # otherwise pulls in as part of the description — a no-op if the phrase isn't there.
  description: [html_unescape, strip, 'regex:^(.*?)\s*További részletek$:1', "truncate:400"]
