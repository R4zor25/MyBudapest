id: tixa
name: Tixa
enabled: true
priority: 35
fetcher: http
rate_limit_seconds: 2
plugin: tixa

# §6.1 step 3 — server-rendered JSON-LD, verified 2026-08-22, fixture
# tests/fixtures/tixa_jatszohazprojekt.html. robots.txt disallows only two 2018 campaign
# paths, so everything here is permitted.
#
# Plugin, not a declarative spec: the event data is inside `<script
# type="application/ld+json">` blocks, which CSS selectors cannot address per field, and
# the request needs an `Accept-Language: hu-HU` header (the YAML schema has no header
# field) or the whole listing comes back in English.
#
# THE MIDNIGHT PLACEHOLDER, AND WHY IT NO LONGER BLOCKS ANYTHING.
# Tixa's `startDate` is machine-readable but only sometimes true. On the Dürer Kert venue
# page, 16 of 24 records carry `T00:00:00` while the real time appears only in
# `customDate` as Hungarian prose without a weekday ("2026. augusztus 22. 19:00") — a
# shape §7.1 cannot parse, and the event detail pages repeat the same `T00:00:00`, so
# there is no second source for the clock.
#
# These records used to be dropped, which cost two thirds of that page. They are now kept:
# a non-empty `customDate` is positive evidence that the ISO field is a placeholder rather
# than a genuine midnight, so the plugin hands over only the DATE and §7.1 reads a bare
# ISO date as `start_time_known: False`. The prose is never parsed — the date is enough
# for the digest, and the flag keeps the night shift, the dedup start gate and the
# rendering honest about what is known. A midnight record with NO `customDate` is still
# dropped and logged (`skipped_placeholder_start`): that is no evidence either way, and a
# wrong time is worse than a missing event.
#
# THE LIST, AND WHY IT IS THIS LENGTH.
# Dürer Kert joined on 2026-08-22, once the placeholder fix removed the reason to hold it
# back: its 24 records used to lose 16 to the midnight drop, so listing it would have shed
# two thirds of the page. It no longer does — re-fetched live the same day, 24 records
# parse, and the page adds 5 events inside a 14-day horizon on top of Játszóház Projekt's
# 2.
#
# It stops at two because the venues cannot be ENUMERATED, not because more were rejected.
# The organiser pages are server-rendered (that is what makes them readable at all), but
# tixa.hu itself is an SPA shell: its homepage HTML carries no organiser links, so there is
# no index to walk. A third venue means either someone naming the slug or a separate look
# at the SPA's own API — a reconnaissance task, not a line in this file. Guessing slugs is
# not it: a wrong one 404s at somebody else's expense.
#
# Játszóház Projekt gives "Hétfői társasozás a Treffort Kertben", a Monday board-game night
# at Treffort Kert & Könyvtár Klub (1088 Budapest, Múzeum krt. 4). Low volume by design —
# the §6.6-B community layer.
listing:
  urls:
    - "https://www.tixa.hu/jatszohazprojekt"
    - "https://www.tixa.hu/durerkert"
