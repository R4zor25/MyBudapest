name: digest

on:
  schedule:
    - cron: "30 4 * * *"        # ~06:30 Europe/Budapest nyáron
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Run digest
        env:
          PROFILE_YAML:    ${{ secrets.PROFILE_YAML }}
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
        run: digest run

      - name: Commit state
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state/state.json site/
          git diff --staged --quiet || git commit -m "chore: digest run $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
